name: Ajustar layout Embarques

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-embarques-layout.yml'
      - '.github/scripts/adjust_embarques_layout.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste de layout
        run: python .github/scripts/adjust_embarques_layout.py

      - name: Publicar alteração
        run: |
          if git diff --quiet -- pages/embarques.html; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/embarques.html
          git commit -m "Ajusta layout responsivo do controle de embarques"
          git push
