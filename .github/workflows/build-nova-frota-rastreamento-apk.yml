name: Build Nova Frota Rastreamento APK
on:
  push:
    branches: [main]
    paths:
      - 'android/nova-frota-rastreamento/**'
      - '.github/workflows/build-nova-frota-rastreamento-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK piloto
        working-directory: android/nova-frota-rastreamento
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaFrota-Rastreamento-Android-APK
          path: android/nova-frota-rastreamento/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
