name: Bump Fretes Asset Version

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/bump_fretes_asset_version.py'
      - '.github/workflows/bump-fretes-asset-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Fretes asset version
        run: python .github/scripts/bump_fretes_asset_version.py

      - name: Validate target
        run: grep -F '<script src="../assets/js/fretes.js?v=12"></script>' pages/fretes.html

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/fretes.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(fretes): load corrected script version"
          git push
