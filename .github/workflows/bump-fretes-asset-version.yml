name: Bump Fretes Asset Version

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/bump_fretes_asset_version.py'
      - '.github/workflows/bump-fretes-asset-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Fretes
        run: python .github/scripts/bump_fretes_asset_version.py

      - name: Validate JavaScript
        run: node --check assets/js/fretes.js

      - name: Validate location field
        run: |
          grep -F 'id="mLocalizacao"' pages/fretes.html
          grep -F 'buildColetaCell' assets/js/fretes.js
          grep -F '🗺️  ${localizacao}' assets/js/fretes.js

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/fretes.html assets/js/fretes.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(fretes): adiciona localização da coleta"
          git push
