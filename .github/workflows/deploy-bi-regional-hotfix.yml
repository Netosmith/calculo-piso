name: Deploy Share Clientes Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bi-regional-hotfix.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Publicar Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Validar gateway
        id: health
        continue-on-error: true
        run: |
          sleep 3
          curl -fsS --max-time 25 https://portalfrete-api.luziano-transportes.workers.dev/v1/gateway-test

      - name: Rollback automático se falhar
        if: steps.health.outcome != 'success'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback 90d1a55f-bcf4-44ee-969f-7fb21e471b83 --message "Rollback automatico apos falha no hotfix Share Clientes"
          exit 1
