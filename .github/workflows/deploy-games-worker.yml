name: Deploy Games Worker
on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'worker/**'
      - '.github/workflows/deploy-games-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar autorização e multiplayer
        run: node --test games/tests/*.test.js
      - name: Conferir credenciais e senha protegida
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_ACCESS_PASSWORD: ${{ secrets.GAMES_ACCESS_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN no GitHub para publicar o multiplayer. O token não deve ser colocado no código."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure o secret CLOUDFLARE_ACCOUNT_ID no GitHub."
            exit 1
          fi
          if ! printf '%s' "$GAMES_ACCESS_PASSWORD" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::Configure GAMES_ACCESS_PASSWORD como uma senha de exatamente 4 números."
            exit 1
          fi
      - name: Instalar Wrangler
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Publicar Worker e salas
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configurar senha do Nova Frota Games
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_ACCESS_PASSWORD: ${{ secrets.GAMES_ACCESS_PASSWORD }}
        run: printf '%s' "$GAMES_ACCESS_PASSWORD" | npx wrangler secret put GAMES_ACCESS_PASSWORD
      - name: Configurar Cine quando os secrets estiverem disponíveis
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINE_PLAYLIST_URL: ${{ secrets.CINE_PLAYLIST_URL }}
          CINE_TOKEN_KEY: ${{ secrets.CINE_TOKEN_KEY }}
          CINE_ALLOWED_ORIGINS: ${{ secrets.CINE_ALLOWED_ORIGINS }}
        run: |
          if [ -z "$CINE_PLAYLIST_URL" ] || [ -z "$CINE_TOKEN_KEY" ]; then
            echo "Cine em preparação: configure CINE_PLAYLIST_URL e CINE_TOKEN_KEY para ativar."
            exit 0
          fi
          node -e 'const e=process.env;const clean=v=>{let s=String(v||"").trim().replace(/[\r\n\t]/g,"");if((s.startsWith("\"")&&s.endsWith("\""))||(s.startsWith("\x27")&&s.endsWith("\x27"))||(s.startsWith("`")&&s.endsWith("`")))s=s.slice(1,-1).trim();return s};const p=clean(e.CINE_PLAYLIST_URL);let u;try{u=new URL(p)}catch{console.error("CINE_PLAYLIST_URL inválido");process.exit(1)};if(!["http:","https:"].includes(u.protocol)||e.CINE_TOKEN_KEY.length<32)process.exit(1);process.stdout.write(JSON.stringify({CINE_PLAYLIST_URL:p,CINE_TOKEN_KEY:e.CINE_TOKEN_KEY,CINE_ALLOWED_ORIGINS:clean(e.CINE_ALLOWED_ORIGINS)}))' | npx wrangler secret bulk
      - name: Configurar listas dos dez acessos quando disponíveis
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINE_TOKEN_KEY: ${{ secrets.CINE_TOKEN_KEY }}
          CINE_ALLOWED_ORIGINS: ${{ secrets.CINE_ALLOWED_ORIGINS }}
          CINE_PLAYLIST_01: ${{ secrets.CINE_PLAYLIST_01 }}
          CINE_PLAYLIST_02: ${{ secrets.CINE_PLAYLIST_02 }}
          CINE_PLAYLIST_03: ${{ secrets.CINE_PLAYLIST_03 }}
          CINE_PLAYLIST_04: ${{ secrets.CINE_PLAYLIST_04 }}
          CINE_PLAYLIST_05: ${{ secrets.CINE_PLAYLIST_05 }}
          CINE_PLAYLIST_06: ${{ secrets.CINE_PLAYLIST_06 }}
          CINE_PLAYLIST_07: ${{ secrets.CINE_PLAYLIST_07 }}
          CINE_PLAYLIST_08: ${{ secrets.CINE_PLAYLIST_08 }}
          CINE_PLAYLIST_09: ${{ secrets.CINE_PLAYLIST_09 }}
          CINE_PLAYLIST_10: ${{ secrets.CINE_PLAYLIST_10 }}
        run: |
          set -euo pipefail
          if [ -z "$CINE_TOKEN_KEY" ]; then
            echo "Listas dos acessos aguardam configuração."
            exit 0
          fi
          node -e 'const e=process.env;if(e.CINE_TOKEN_KEY.length<32){console.error("CINE_TOKEN_KEY deve ter pelo menos 32 caracteres");process.exit(1)};const clean=v=>{let s=String(v||"").trim().replace(/[\r\n\t]/g,"");if((s.startsWith("\"")&&s.endsWith("\""))||(s.startsWith("\x27")&&s.endsWith("\x27"))||(s.startsWith("`")&&s.endsWith("`")))s=s.slice(1,-1).trim();return s};const data={CINE_TOKEN_KEY:e.CINE_TOKEN_KEY};const origins=clean(e.CINE_ALLOWED_ORIGINS);if(origins)data.CINE_ALLOWED_ORIGINS=origins;for(let i=1;i<=10;i++){const k="CINE_PLAYLIST_"+String(i).padStart(2,"0");const value=clean(e[k]);if(!value)continue;let u;try{u=new URL(value)}catch{console.error("Secret inválido: "+k+". O valor deve conter somente a URL completa.");process.exit(1)}if(!["http:","https:"].includes(u.protocol)){console.error("Secret inválido: "+k+". Use http:// ou https://.");process.exit(1)}data[k]=value;console.error(k+" aceito ("+u.protocol+"//"+u.host+")")}process.stdout.write(JSON.stringify(data))' | npx wrangler secret bulk
