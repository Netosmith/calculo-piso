name: Deploy Games Worker
on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'worker/**'
      - '.github/workflows/deploy-games-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar autorização e multiplayer
        run: node --test games/tests/*.test.js
      - name: Conferir credenciais e senha protegida
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_ACCESS_PASSWORD: ${{ secrets.GAMES_ACCESS_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN no GitHub para publicar o multiplayer. O token não deve ser colocado no código."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure o secret CLOUDFLARE_ACCOUNT_ID no GitHub."
            exit 1
          fi
          if ! printf '%s' "$GAMES_ACCESS_PASSWORD" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::Configure GAMES_ACCESS_PASSWORD como uma senha de exatamente 4 números."
            exit 1
          fi
      - name: Instalar Wrangler
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Publicar Worker e salas
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configurar senha do Nova Frota Games
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_ACCESS_PASSWORD: ${{ secrets.GAMES_ACCESS_PASSWORD }}
        run: printf '%s' "$GAMES_ACCESS_PASSWORD" | npx wrangler secret put GAMES_ACCESS_PASSWORD
