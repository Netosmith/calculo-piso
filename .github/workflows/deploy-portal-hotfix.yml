name: Deploy Portal Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-portal-hotfix.yml'
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Garantir bucket R2 de logos
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler r2 bucket info portal-clientes >/dev/null 2>&1; then
            echo "Bucket portal-clientes já existe."
          else
            echo "Criando bucket portal-clientes..."
            npx wrangler r2 bucket create portal-clientes
          fi

      - name: Publicar Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Validar ponte com Apps Script
        id: health
        continue-on-error: true
        run: |
          sleep 3
          curl -fsS --max-time 25 https://portalfrete-api.luziano-transportes.workers.dev/v1/gateway-test

      - name: Validar API pública Pingo Chic
        id: pingo
        continue-on-error: true
        run: |
          curl -fsS --max-time 25 \
            -H 'Origin: https://portalfrete.net.br' \
            https://portalfrete-api.luziano-transportes.workers.dev/v1/pingo/catalog \
            -o /tmp/pingo-catalog.json
          cat /tmp/pingo-catalog.json
          grep -q '"products"' /tmp/pingo-catalog.json

      - name: Diagnosticar domínio público da API
        id: pingo_domain
        continue-on-error: true
        run: |
          curl -fsS --max-time 25 \
            -H 'Origin: https://portalfrete.net.br' \
            https://api.portalfrete.net.br/v1/pingo/catalog \
            -o /tmp/pingo-domain.json
          cat /tmp/pingo-domain.json
          grep -q '"products"' /tmp/pingo-domain.json

      - name: Validar rota de logos no R2
        id: logo_route
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/logo-route.json -w "%{http_code}" --max-time 25 \
            https://portalfrete-api.luziano-transportes.workers.dev/v1/client-logos/CLIENTE-TESTE-R2)
          cat /tmp/logo-route.json
          test "$code" = "404"
          grep -q "Logo não encontrada" /tmp/logo-route.json

      - name: Rollback automático se serviços críticos falharem
        if: steps.health.outcome != 'success' || steps.logo_route.outcome != 'success' || steps.pingo.outcome != 'success'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Rollback automático após falha nos testes do Worker"
          exit 1

      - name: Alertar falha apenas no domínio customizado da Pingo Chic
        if: steps.pingo.outcome == 'success' && steps.pingo_domain.outcome != 'success'
        run: |
          echo "A API Pingo Chic está saudável no workers.dev, mas api.portalfrete.net.br falhou."
          echo "Verifique Domains & Routes/DNS no Cloudflare."
