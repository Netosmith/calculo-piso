name: Deploy Portal Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-portal-hotfix.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Publicar hotfix do Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Validar ponte com Apps Script
        id: health
        continue-on-error: true
        run: |
          sleep 3
          curl -fsS --max-time 25 https://portalfrete-api.luziano-transportes.workers.dev/v1/gateway-test

      - name: Rollback automático se o gateway falhar
        if: steps.health.outcome != 'success'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback dbed9987-e03e-4b1c-8f14-4fcad14d5cf3 --message "Rollback automatico apos falha no hotfix de cadastros"
          exit 1
