name: Deploy Portal Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-portal-hotfix.yml'
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Garantir bucket R2 de logos
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler r2 bucket info portal-clientes >/dev/null 2>&1; then
            echo "Bucket portal-clientes já existe."
          else
            echo "Criando bucket portal-clientes..."
            npx wrangler r2 bucket create portal-clientes
          fi

      - name: Publicar hotfix do Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Validar ponte com Apps Script
        id: health
        continue-on-error: true
        run: |
          sleep 3
          curl -fsS --max-time 25 https://portalfrete-api.luziano-transportes.workers.dev/v1/gateway-test

      - name: Validar rota de logos no R2
        id: logo_route
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/logo-route.json -w "%{http_code}" --max-time 25 \
            https://portalfrete-api.luziano-transportes.workers.dev/v1/client-logos/CLIENTE-TESTE-R2)
          cat /tmp/logo-route.json
          test "$code" = "404"
          grep -q "Logo não encontrada" /tmp/logo-route.json

      - name: Rollback automático se o gateway ou R2 falhar
        if: steps.health.outcome != 'success' || steps.logo_route.outcome != 'success'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback dbed9987-e03e-4b1c-8f14-4fcad14d5cf3 --message "Rollback automatico apos falha no hotfix de cadastros"
          exit 1
