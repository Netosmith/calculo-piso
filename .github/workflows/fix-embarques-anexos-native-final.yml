name: Fix Embarques Attachments Native Final
on:
  push:
    paths:
      - '.github/fix-embarques-anexos-native-final.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python .github/scripts/fix_embarques_anexos_native_final.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/embarques.html assets/js/embarques.js
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git commit -m "fix: corrige anexos de embarques por completo"
          git push
