name: Fix Fretes response shape

on:
  push:
    paths:
      - '.github/scripts/fix_fretes_response_shape.py'
      - '.github/workflows/fix-fretes-response-shape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Corrigir leitura da resposta
        run: python .github/scripts/fix_fretes_response_shape.py

      - name: Validar JavaScript
        run: node --check assets/js/fretes.js

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/fretes.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix(fretes): accept gateway response object"
            git push
          fi
