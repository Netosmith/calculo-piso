name: Fix ordens group filter v2

on:
  push:
    paths:
      - '.github/fix-ordens-group-filter-v2.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python3 .github/scripts/fix_ordens_group_filter_v2.py

      - name: Validar
        run: |
          grep -q 'function lerMapaGruposOrdens' pages/relatorio.html
          grep -q 'window.NF_applyOrdensFilters = aplicarFiltrosOrdens' pages/relatorio.html
          grep -q 'const conjuntoGrupo = new Set(unidadesGrupo)' pages/relatorio.html
          grep -q 'mapaAtual\[grupo\]' pages/relatorio.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/relatorio.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrige filtro dos grupos de unidades no dashboard de ordens"
          git push
