name: Fix Pingo Chic Banner Ratio

on:
  push:
    paths:
      - '.github/workflows/fix-pingochic-banner-ratio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar proporção dos banners
        shell: python
        run: |
          from pathlib import Path

          css = Path('assets/pingochic/store.css')
          s = css.read_text(encoding='utf-8')
          old = '.promos .promo{min-height:132px;padding:22px 24px}'
          new = '.promos .promo{min-height:0;aspect-ratio:1200/410;padding:22px 24px}'
          if old not in s:
              raise SystemExit('Regra compacta dos banners não encontrada.')
          s = s.replace(old, new, 1)
          css.write_text(s, encoding='utf-8')

          page = Path('pages/pingochic.html')
          p = page.read_text(encoding='utf-8')
          p = p.replace('store.css?v=20261003174500', 'store.css?v=20261003175500')
          page.write_text(p, encoding='utf-8')

      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pingochic/store.css pages/pingochic.html
          git commit -m "fix(pingochic): padroniza banners em 1200x410"
          git push origin HEAD:main