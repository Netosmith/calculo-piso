name: Fix relatorio groups

on:
  push:
    paths:
      - '.github/fix-relatorio-groups.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python3 .github/fix_buttons_groups.py

      - name: Validar
        run: |
          grep -q 'NF_addOrdensGroupUnits' pages/relatorio.html
          grep -q 'NF_removeOrdensGroupUnits' pages/relatorio.html
          grep -q 'NF_saveOrdensGroup' pages/relatorio.html
          grep -q 'NF_closeOrdensGroups' pages/relatorio.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/relatorio.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: ativa botoes do gerenciador de grupos"
          git push
