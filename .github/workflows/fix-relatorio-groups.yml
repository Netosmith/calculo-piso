name: Fix relatorio groups

on:
  push:
    paths:
      - '.github/fix-relatorio-groups.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python scripts/fix_relatorio_groups.py

      - name: Validar
        run: |
          grep -q 'window.NF_openOrdensGroups = abrirConfigGrupoUnidades' pages/relatorio.html
          grep -q 'onclick="window.NF_openOrdensGroups' pages/relatorio.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/relatorio.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "fix: corrige abertura dos grupos de Unid Emb"
          git push
