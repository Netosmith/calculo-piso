name: Fix Share Clientes Nested Data

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_share_clientes_nested_data.py'
      - '.github/workflows/fix-share-clientes-nested-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        run: python .github/scripts/fix_share_clientes_nested_data.py

      - name: Validate JavaScript
        run: node --check assets/js/share-clientes.js

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/share-clientes.js pages/share-clientes.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(share): read nested gateway data and refresh cache"
          git push
