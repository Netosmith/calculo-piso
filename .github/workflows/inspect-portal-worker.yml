name: Inspect Portal Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-portal-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Wrangler
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Listar nomes dos secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list --format=json

      - name: Listar deployments recentes
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --json

      - name: Comparar versão estável e versão problemática
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== ESTAVEL ==="
          npx wrangler versions view dbed9987-e03e-4b1c-8f14-4fcad14d5cf3 --json
          echo "=== PROBLEMATICA ==="
          npx wrangler versions view 86921bff-b948-4ec0-b18c-79259fe9cdb9 --json


      - name: Testar gateway público
        run: |
          echo "=== workers.dev ==="
          curl -fsS --max-time 20 https://portalfrete-api.luziano-transportes.workers.dev/v1/gateway-test
          echo
          echo "=== dominio ==="
          curl -fsS --max-time 20 https://api.portalfrete.net.br/v1/gateway-test
          echo
