name: Portal Frete - Gerar APK Android de teste
on:
  push:
    branches: [main]
    paths:
      - 'mobile/portal-frete/**'
      - '.github/workflows/mobile-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/portal-frete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar código de rotas
        run: npm run check
      - name: Gerar projeto Android nativo (Expo Prebuild)
        run: CI=1 npx expo prebuild --platform android --clean --no-install
      - name: Compilar APK de depuração
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Frete-Android-DEBUG-NAO-PUBLICAR
          path: mobile/portal-frete/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
