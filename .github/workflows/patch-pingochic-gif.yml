name: Patch Pingo Chic GIF

on:
  push:
    paths:
      - '.github/workflows/patch-pingochic-gif.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Habilitar GIF no armazenamento da Pingo Chic
        shell: python
        run: |
          from pathlib import Path

          p = Path('worker/src/pingochic/store-do.js')
          s = p.read_text(encoding='utf-8')
          original = s

          replacements = [
              (
                  r'if (!/^[a-z0-9-]+\\.(webp|jpg|jpeg|png)$/i.test(key)) throw new HttpError(400, "Chave inválida.");',
                  r'if (!/^[a-z0-9-]+\\.(webp|jpg|jpeg|png|gif)$/i.test(key)) throw new HttpError(400, "Chave inválida.");'
              ),
              (
                  'const ext = { "image/webp": "webp", "image/jpeg": "jpg", "image/png": "png" }[type];',
                  'const ext = { "image/webp": "webp", "image/jpeg": "jpg", "image/png": "png", "image/gif": "gif" }[type];'
              ),
              (
                  'if (!ext) throw new HttpError(400, "Formato de imagem não suportado (use JPG, PNG ou WEBP).");',
                  'if (!ext) throw new HttpError(400, "Formato de mídia não suportado (use JPG, PNG, WEBP ou GIF).");'
              ),
              (
                  'if (buf.byteLength > MAX_IMAGE_BYTES) throw new HttpError(413, "Imagem muito grande (máx. 4 MB).");',
                  'const maxBytes = type === "image/gif" ? 8 * 1024 * 1024 : MAX_IMAGE_BYTES;\n      if (buf.byteLength > maxBytes) throw new HttpError(413, type === "image/gif" ? "GIF muito grande (máx. 8 MB)." : "Imagem muito grande (máx. 4 MB).");'
              )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Trecho esperado não encontrado: {old}')
              s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('Nenhuma alteração aplicada.')

          p.write_text(s, encoding='utf-8')

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/pingochic/store-do.js
          git commit -m "feat(pingochic): permite GIF nos banners"
          git push origin HEAD:main
