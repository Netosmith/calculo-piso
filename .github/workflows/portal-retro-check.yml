name: Portal Retro Games - diagnostico de acesso
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portal-retro-check.yml'
      - 'ACERVO-RETRO/**'
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar URLs e recursos do Portal Retro
        shell: bash
        run: |
          set +e
          urls=(
            "https://portalfrete.net.br/ACERVO-RETRO/"
            "http://portalfrete.net.br/ACERVO-RETRO/"
            "https://portalfrete.net.br/ACERVO-RETRO/index.html"
            "https://portalfrete.net.br/ACERVO-RETRO/assets/app.js"
            "https://portalfrete.net.br/ACERVO-RETRO/assets/style.css"
            "https://netosmith.github.io/calculo-piso/ACERVO-RETRO/"
          )
          for url in "${urls[@]}"; do
            echo "=============================="
            echo "CHECK: $url"
            curl --location --silent --show-error --max-time 20 --output /tmp/retro-response --write-out 'HTTP=%{http_code} FINAL=%{url_effective} SSL=%{ssl_verify_result} TYPE=%{content_type} BYTES=%{size_download}\n' "$url"
            code=$?
            echo "CURL_EXIT=$code"
            if [ -f /tmp/retro-response ]; then
              printf 'FIRST='
              head -c 180 /tmp/retro-response | tr '\n' ' '
              echo
              rm -f /tmp/retro-response
            fi
          done

      - name: Testar abertura real no navegador Chromium
        shell: bash
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "BROWSER=$BROWSER"
          if [ -z "$BROWSER" ]; then
            echo "BROWSER_UNAVAILABLE"
            exit 0
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=7000 --dump-dom "https://portalfrete.net.br/ACERVO-RETRO/index.html" >/tmp/retro-dom 2>/tmp/retro-chrome-errors
          echo "RENDERED_HTML_SIZE=$(wc -c </tmp/retro-dom)"
          if grep -q 'Meus Consoles' /tmp/retro-dom; then
            echo "RENDER_HOME=SUCCESS"
          else
            echo "RENDER_HOME=FAIL"
          fi
          if grep -q 'Carregando Portal' /tmp/retro-dom; then
            echo "POSSIBLE_STUCK_LOADING"
          fi
          echo "CHROME_LOG:"
          tail -n 18 /tmp/retro-chrome-errors
          echo "DOC_PREVIEW:"
          head -c 500 /tmp/retro-dom
          echo
