name: Repair expedicao controls

on:
  push:
    paths:
      - '.github/repair-expedicao-controls.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar reparo
        run: python3 .github/scripts/repair_expedicao_controls.py

      - name: Validar JavaScript e controles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/relatorio.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(\(\(\) => \{.*?\}\)\(\);)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('Script principal nao encontrado')
          Path('/tmp/relatorio.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/relatorio.js
          grep -q 'NF_importExpedicaoFile' pages/relatorio.html
          grep -q 'NF_applyExpedicaoFilters' pages/relatorio.html
          grep -q 'NF_openExpedicaoGroups' pages/relatorio.html
          grep -q 'document.getElementById.*csvInput' pages/relatorio.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/relatorio.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restaura controles do dashboard de expedicao"
          git push
