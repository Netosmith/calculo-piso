name: Emergency Rollback Portal Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-portal-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Wrangler
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Restaurar versão anterior do Portal Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback --message "Rollback: restaurar Portal Frete apos erro 404 do Apps Script"
