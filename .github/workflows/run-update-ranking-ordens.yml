name: Run update ranking ordens
on:
  push:
    paths:
      - .github/workflows/run-update-ranking-ordens.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar atualização
        run: python3 .github/scripts/update_ranking_ordens.py
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('pages/relatorio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/relatorio-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/relatorio-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/relatorio.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: adiciona ranking de funcionarios no dashboard de ordens"
          git push
