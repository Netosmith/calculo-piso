name: Super Admin Preview (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/super-admin-panel-foundation
    paths:
      - 'pages/super-admin-preview.html'
      - '.github/workflows/super-admin-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview file
        run: |
          test -s pages/super-admin-preview.html
          grep -q 'PRÉVIA DEMONSTRATIVA' pages/super-admin-preview.html
          ! grep -q 'api.portalfrete.net.br' pages/super-admin-preview.html
      - name: Prepare standalone preview site
        run: |
          mkdir -p preview-site
          cp pages/super-admin-preview.html preview-site/index.html
          echo '<meta name="robots" content="noindex,nofollow">' > preview-site/robots-note.html
      - name: Package offline HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: super-admin-preview
          path: pages/super-admin-preview.html
          retention-days: 14
      - name: Upload GitHub Pages preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site
      - name: Deploy isolated GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
