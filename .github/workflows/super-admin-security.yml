name: Super Admin Security Tests
on:
  push:
    branches:
      - feature/super-admin-panel-foundation
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/super-admin-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Worker tooling
        run: npm ci
      - name: Security regression tests
        run: npm test
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir .worker-dry-run
      - name: Validate isolated Super Admin staging configuration
        run: npx wrangler deploy --config wrangler.super-admin-staging.jsonc --dry-run --outdir .worker-staging-dry-run

      - name: Validate tenant SQL migration in isolated SQLite
        working-directory: .
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys=ON")
          db.executescript(Path("worker/migrations/super-admin/0001_tenants.sql").read_text())
          db.executescript(Path("worker/migrations/super-admin/0002_tenant_portal.sql").read_text())
          db.execute("INSERT INTO portal_tenants(id,name) VALUES (?,?)",("nova-frota","Nova Frota"))
          for role in ("ADMINISTRADOR","COMERCIAL","OPERACIONAL","PISO","GOADM","MT","PR"):
              db.execute("INSERT INTO portal_tenant_users(tenant_id,user_id,role) VALUES (?,?,?)",("nova-frota",role.lower(),role))
          assert db.execute("SELECT COUNT(*) FROM portal_tenant_users").fetchone()[0]==7
          try:
              db.execute("INSERT INTO portal_tenant_users(tenant_id,user_id,role) VALUES (?,?,?)",("other","bad","PISO"))
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError("Tenant foreign key was not enforced")
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('portal_tenant_credentials','portal_tenant_sessions','portal_tenant_login_attempts','portal_tenant_freights')").fetchone()[0] == 4
          print("Tenant schema, access tables and seven legacy roles validated.")
          PY
