name: Super Admin Staging Worker (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY_STAGING para publicar SOMENTE o Worker de homologacao'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    if: ${{ (github.ref_name == 'main' || github.ref_name == 'feature/super-admin-panel-foundation') && inputs.confirmation == 'DEPLOY_STAGING' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Validate Cloudflare deployment credentials
        env:
          STAGING_TOKEN: ${{ secrets.CLOUDFLARE_SUPER_ADMIN_STAGING_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$STAGING_TOKEN" || { echo 'Missing Cloudflare token: set CLOUDFLARE_SUPER_ADMIN_STAGING_TOKEN or reuse CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Run Worker security regression tests
        run: npm test
      - name: Verify dedicated staging build without deployment
        run: npx wrangler deploy --config wrangler.super-admin-staging.jsonc --dry-run --outdir .staging-bundle
      - name: Deploy only isolated portalfrete-super-admin-staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SUPER_ADMIN_STAGING_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.super-admin-staging.jsonc
