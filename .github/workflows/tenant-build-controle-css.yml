name: Build Static Controle CSS for Tenant Template

on:
  push:
    branches:
      - fix/tenant-header-controle-shared-assets-20261103
    paths:
      - assets/css/controle-tailwind.config.cjs
      - pages/controle.html
      - .github/workflows/tenant-build-controle-css.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile self-hosted Tailwind CSS
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pf-controle-css --no-audit --no-fund --no-save --no-package-lock tailwindcss@3.4.17 @tailwindcss/forms@0.5.10
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' >/tmp/pf-controle-input.css
          /tmp/pf-controle-css/node_modules/.bin/tailwindcss \
            -c ./assets/css/controle-tailwind.config.cjs \
            -i /tmp/pf-controle-input.css \
            -o ./assets/css/controle-tailwind.generated.css --minify
          test -s assets/css/controle-tailwind.generated.css
          grep -q '.grid' assets/css/controle-tailwind.generated.css
          grep -q '.rounded-xl' assets/css/controle-tailwind.generated.css
          wc -c assets/css/controle-tailwind.generated.css
      - name: Commit generated CSS to same PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/controle-tailwind.generated.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(controle): add self-hosted compiled Tailwind CSS for tenant pages"
          git push origin HEAD:fix/tenant-header-controle-shared-assets-20261103
