plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.novafrota.rastreamento'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.novafrota.rastreamento'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-piloto'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
