<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081629">
<meta name="description" content="Lotofácil Lab: estudo de combinações, chances, orçamento e conferência de dezenas. Simulador independente e não oficial.">
<title>Lotofácil Lab | Nova Frota Games</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./style.css?v=20261106-sequencial-1">
</head>
<body class="games-locked">
<section class="access-lock" id="accessScreen" aria-labelledby="accessTitle">
  <div class="access-card">
    <span class="brandmark">N<span>F</span></span>
    <span class="pill">ACESSO PROTEGIDO</span>
    <h1 id="accessTitle">Lotofácil Lab</h1>
    <p>Olá, <b id="accessUser">Administrador</b>. Digite a senha de acesso para continuar.</p>
    <form id="accessForm">
      <label for="accessPassword">SENHA DE 4 NÚMEROS</label>
      <input id="accessPassword" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" aria-describedby="accessError" required>
      <button id="unlockGames" class="primary" type="submit">Abrir Lotofácil Lab ↗</button>
      <p id="accessError" role="alert" aria-live="polite"></p>
    </form>
    <a href="../index.html">← Voltar a Nova Frota Games</a>
    <small>Mesma autorização da Nova Frota Games</small>
  </div>
</section>
<main class="loto-shell" id="lotoRoot" aria-label="Simulador Lotofácil">
 <div style="text-align:center;padding:22vh 16px;color:#a6c6dc">✦ Preparando simulador de probabilidades…</div>
</main>
<script type="module">
 import { authorize } from '../js/network.js';
 await authorize();
 await import('./app.js?v=20261106-sequencial-1');
</script>
</body>
</html>
