<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administrativo | NOVA FROTA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/administrativo.css" />

  <style>
    :root{
      --adm-navy:#07172d;
      --adm-navy-2:#0d2848;
      --adm-line:rgba(173,204,240,.20);
      --adm-text:#f5f8ff;
      --adm-muted:#aebdd0;
      --adm-blue:#4e8df7;
      --adm-green:#36b97e;
      --adm-gold:#f0b82e;
      --adm-purple:#9a68db;
      --adm-slate:#7c8fa7;
      --adm-white:#f8fbff;
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      background:var(--adm-navy);
    }

    body{
      min-height:100vh;
      margin:0;
      color:var(--adm-text);
      background:var(--adm-navy);
      font-family:"Inter",Arial,sans-serif;
    }

    /* =========================================================
       TOPBAR - MESMA LINGUAGEM DA HOME
       ========================================================= */
    .topbar{
      position:relative;
      z-index:30;
      height:86px;
      background:rgba(4,13,29,.97) !important;
      border-bottom:1px solid rgba(255,255,255,.06) !important;
      box-shadow:none !important;
    }

    .topbar-inner{
      width:min(100% - 44px,1780px) !important;
      height:100%;
      margin:auto;
      padding:0 !important;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand img{
      display:block;
      width:168px !important;
      max-height:46px;
      object-fit:contain;
    }

    .burger,
    .icon-btn{
      width:44px !important;
      height:44px !important;
      display:grid !important;
      place-items:center !important;
      border:1px solid rgba(255,255,255,.13) !important;
      border-radius:13px !important;
      background:rgba(255,255,255,.04) !important;
      color:#fff !important;
      text-decoration:none;
      cursor:pointer;
      transition:.18s ease;
    }

    .burger{
      position:relative;
    }

    .burger::before{
      content:"⌂";
      font-size:20px;
      line-height:1;
      color:#fff;
    }

    .burger div{display:none !important}

    .burger:hover,
    .icon-btn:hover{
      background:rgba(255,255,255,.10) !important;
      transform:translateY(-1px);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .badge{
      min-width:18px;
      height:18px;
      padding:0 5px;
      display:inline-grid;
      place-items:center;
      border-radius:999px;
      background:var(--adm-gold);
      color:#152238;
      font-size:10px;
      font-weight:900;
    }

    /* =========================================================
       FUNDO E ESTRUTURA
       ========================================================= */
    .hero.admin-hero{
      position:relative;
      isolation:isolate;
      min-height:calc(100vh - 86px);
      padding:44px 0 34px !important;
      overflow:hidden;
      background:#0a1b35 !important;
    }

    .hero.admin-hero::before{
      content:"";
      position:absolute;
      z-index:0;
      inset:0;
      background:
        linear-gradient(90deg,rgba(7,23,45,.93) 0%,rgba(7,23,45,.77) 34%,rgba(7,23,45,.35) 72%,rgba(7,23,45,.58) 100%),
        linear-gradient(180deg,rgba(5,16,33,.16) 0%,rgba(5,18,37,.35) 56%,rgba(5,18,37,.88) 100%),
        url("../assets/img/FUNDO.jpg") center top / cover no-repeat;
      pointer-events:none;
    }

    .hero.admin-hero::after{
      content:"";
      position:absolute;
      z-index:0;
      inset:0 0 auto 42%;
      height:430px;
      background:
        radial-gradient(circle at 76% 12%,rgba(64,111,170,.30),transparent 42%),
        linear-gradient(90deg,#0b1d38 0%,rgba(11,29,56,.38) 42%,rgba(5,17,34,.06) 100%);
      opacity:.44;
      pointer-events:none;
    }

    .admin-wrap{
      position:relative;
      z-index:2;
      width:min(100% - 72px,1560px) !important;
      max-width:none !important;
      margin:auto !important;
      padding:0 !important;
    }

    .adminPage{
      color:var(--adm-text);
    }

    /* =========================================================
       CABEÇALHO
       ========================================================= */
    .admin-head{
      margin-bottom:28px;
    }

    .admin-title{
      padding:0 !important;
      background:none !important;
      border:0 !important;
      box-shadow:none !important;
    }

    .admin-title-row{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .admin-gear{
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border:1px solid rgba(78,141,247,.58);
      border-radius:16px;
      background:rgba(78,141,247,.12);
      color:#fff;
      font-size:26px;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
    }

    .admin-h1{
      color:#fff !important;
      font-size:clamp(31px,3vw,46px) !important;
      line-height:1 !important;
      font-weight:800 !important;
      letter-spacing:-1.5px !important;
    }

    .admin-sub{
      margin-top:10px !important;
      color:#c4d0df !important;
      font-size:15px !important;
      font-weight:500 !important;
    }

    .admin-sync{
      margin-top:7px !important;
      color:#91a5bd !important;
      font-size:11px !important;
    }

    /* =========================================================
       KPIs - MESMO CONCEITO DOS CARDS ESCUROS DA HOME
       ========================================================= */
    .admin-summary{
      display:grid !important;
      grid-template-columns:repeat(6,minmax(0,1fr)) !important;
      gap:14px !important;
      margin:0 0 24px !important;
    }

    .sumCard{
      --accent:var(--adm-blue);
      position:relative;
      min-width:0;
      min-height:150px !important;
      padding:18px 18px 16px !important;
      display:flex !important;
      flex-direction:column !important;
      align-items:flex-start !important;
      justify-content:flex-start !important;
      gap:12px !important;
      overflow:hidden;
      border:1px solid color-mix(in srgb,var(--accent) 35%,rgba(173,204,240,.18)) !important;
      border-radius:18px !important;
      color:#fff !important;
      text-align:left !important;
      background:
        radial-gradient(circle at 88% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 42%),
        linear-gradient(145deg,rgba(18,42,75,.93),rgba(8,25,49,.88)) !important;
      box-shadow:0 18px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05) !important;
      backdrop-filter:blur(16px);
      cursor:pointer;
      transition:.18s ease;
    }

    .sumCard::after{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      bottom:0;
      height:4px;
      border-radius:10px 10px 0 0;
      background:var(--accent);
      box-shadow:0 0 18px color-mix(in srgb,var(--accent) 62%,transparent);
    }

    .sumCard:hover,
    .sumCard.isActive{
      transform:translateY(-3px);
      border-color:color-mix(in srgb,var(--accent) 60%,rgba(173,204,240,.25)) !important;
      box-shadow:0 20px 44px rgba(0,0,0,.30),0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent) !important;
    }

    .sumBlue{--accent:var(--adm-blue)}
    .sumGreen{--accent:var(--adm-green)}
    .sumGold{--accent:var(--adm-gold)}
    .sumPurple{--accent:var(--adm-purple)}
    .sumSlate{--accent:var(--adm-slate)}

    .sumIcon{
      width:44px !important;
      height:44px !important;
      display:grid !important;
      place-items:center !important;
      flex:0 0 auto;
      border:1px solid color-mix(in srgb,var(--accent) 72%,white 8%) !important;
      border-radius:13px !important;
      color:#fff !important;
      background:color-mix(in srgb,var(--accent) 34%,transparent) !important;
      font-size:20px !important;
      box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 16%,transparent);
    }

    .sumTxt{
      width:100%;
    }

    .sumTitle{
      color:#eef5ff !important;
      font-size:11px !important;
      font-weight:800 !important;
      letter-spacing:.055em !important;
      text-transform:uppercase !important;
    }

    .sumValue{
      margin-top:10px !important;
      color:#fff !important;
      font-size:20px !important;
      line-height:1.15 !important;
      font-weight:800 !important;
      letter-spacing:-.5px !important;
    }

    .sumValue span{
      font-size:32px !important;
      letter-spacing:-1px;
    }

    /* =========================================================
       TABS
       ========================================================= */
    .admin-tabs{
      position:relative;
      margin:0 0 14px !important;
      padding:8px !important;
      display:flex !important;
      align-items:center !important;
      gap:8px !important;
      overflow:auto;
      border:1px solid rgba(255,255,255,.10) !important;
      border-radius:15px !important;
      background:rgba(8,26,49,.72) !important;
      backdrop-filter:blur(14px);
    }

    .tabBtn{
      min-height:40px !important;
      padding:0 16px !important;
      flex:0 0 auto;
      border:1px solid transparent !important;
      border-radius:10px !important;
      background:transparent !important;
      color:#aebdd0 !important;
      font-size:12px !important;
      font-weight:700 !important;
      cursor:pointer;
      transition:.18s ease;
    }

    .tabBtn:hover{
      color:#fff !important;
      background:rgba(255,255,255,.05) !important;
    }

    .tabBtn.isActive{
      color:#fff !important;
      border-color:rgba(78,141,247,.40) !important;
      background:rgba(78,141,247,.15) !important;
      box-shadow:inset 0 0 0 1px rgba(78,141,247,.08);
    }

    .tabLine{display:none !important}

    /* =========================================================
       PAINEL CENTRAL
       ========================================================= */
    .admin-panel{
      overflow:hidden;
      border:1px solid rgba(173,204,240,.18) !important;
      border-radius:18px !important;
      background:linear-gradient(145deg,rgba(13,39,70,.94),rgba(7,25,48,.92)) !important;
      box-shadow:0 18px 42px rgba(0,0,0,.24) !important;
      backdrop-filter:blur(16px);
    }

    .panelHead{
      padding:17px 18px !important;
      display:flex !important;
      align-items:center !important;
      justify-content:space-between !important;
      gap:15px !important;
      border-bottom:1px solid rgba(173,204,240,.13) !important;
      background:rgba(7,24,46,.46) !important;
    }

    .panelTitle{
      color:#fff !important;
      font-size:17px !important;
      font-weight:800 !important;
      letter-spacing:-.2px;
    }

    .panelRight{
      display:flex !important;
      align-items:center !important;
      justify-content:flex-end !important;
      gap:9px !important;
      flex-wrap:wrap;
    }

    .adminSelect,
    .adminSearch{
      min-height:41px !important;
      padding:0 12px !important;
      border:1px solid rgba(173,204,240,.18) !important;
      border-radius:10px !important;
      outline:none !important;
      background:#0a203d !important;
      color:#fff !important;
      font:500 12px "Inter",sans-serif !important;
    }

    .adminSelect{
      min-width:185px;
    }

    .adminSearch{
      width:250px !important;
    }

    .adminSearch::placeholder{color:#7f95ad}

    .adminSelect:focus,
    .adminSearch:focus{
      border-color:rgba(78,141,247,.70) !important;
      box-shadow:0 0 0 3px rgba(78,141,247,.12) !important;
    }

    .btnAdmin{
      min-height:41px !important;
      padding:0 15px !important;
      border:1px solid rgba(78,141,247,.70) !important;
      border-radius:10px !important;
      background:linear-gradient(135deg,#2f70d6,#4e8df7) !important;
      color:#fff !important;
      font:800 12px "Inter",sans-serif !important;
      cursor:pointer;
      box-shadow:0 9px 18px rgba(35,95,190,.18);
    }

    .btnAdmin:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    .btnAdmin.ghost{
      border-color:rgba(255,255,255,.14) !important;
      background:rgba(255,255,255,.05) !important;
      box-shadow:none;
    }

    .panelBody{
      min-height:420px;
      padding:18px !important;
      background:transparent !important;
    }

    .view{display:none}
    .view.isActive{display:block}

    /* =========================================================
       CARDS GERADOS PELO JS
       Mantemos IDs/classes e só mudamos a pele.
       ========================================================= */
    .cardsGrid{
      display:grid !important;
      grid-template-columns:repeat(4,minmax(0,1fr)) !important;
      gap:14px !important;
    }

    .cardsGrid > *{
      border:1px solid rgba(78,141,247,.24) !important;
      border-radius:16px !important;
      background:
        radial-gradient(circle at 90% 5%,rgba(78,141,247,.12),transparent 42%),
        linear-gradient(145deg,#102d50 0%,#0a213d 55%,#081a31 100%) !important;
      color:#f5f8ff !important;
      box-shadow:
        0 12px 28px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.04) !important;
      overflow:hidden;
    }

    /* cards conhecidos do administrativo.js */
    .adminCard,
    .frotaCard,
    .solicCard,
    .patrimonioCard,
    .epiCard,
    .card,
    .nf-dark-card{
      border-radius:16px !important;
    }

    .cardsGrid h3,
    .cardsGrid h4,
    .cardsGrid strong,
    .cardsGrid b,
    .cardsGrid .big,
    .cardsGrid .smallLine{
      color:#f5f8ff !important;
    }

    .cardsGrid p,
    .cardsGrid small,
    .cardsGrid .muted,
    .cardsGrid .tagLine{
      color:#aebdd0 !important;
    }

    .cardsGrid .adminCardTop{
      background:transparent !important;
    }

    .cardsGrid .adminCardFoot{
      background:rgba(4,17,34,.34) !important;
      border-top:1px solid rgba(173,204,240,.10) !important;
    }

    .cardsGrid .avatar{
      color:#d9e7ff !important;
      background:rgba(78,141,247,.13) !important;
      border:1px solid rgba(78,141,247,.28) !important;
    }

    .cardsGrid .linkBtn{
      color:#d9e7ff !important;
      border-color:rgba(173,204,240,.18) !important;
      background:rgba(255,255,255,.04) !important;
    }

    .cardsGrid .linkBtn:hover{
      color:#fff !important;
      border-color:rgba(78,141,247,.48) !important;
      background:rgba(78,141,247,.13) !important;
    }

    .cardsGrid .pill.ok{
      color:#0b6b43 !important;
      background:#d9f6e7 !important;
      border-color:#8ed8b4 !important;
    }

    .cardsGrid .pill.pendente{
      color:#8a5b00 !important;
      background:#fff1c9 !important;
      border-color:#f4c767 !important;
    }

    .cardsGrid .pill.atrasado{
      color:#9f1f2a !important;
      background:#ffe0e4 !important;
      border-color:#f5a6ae !important;
    }

    /* =========================================================
       CHEQUES / MATERIAIS
       ========================================================= */
    .chequesBox{
      padding:0 !important;
      border:0 !important;
      background:transparent !important;
      box-shadow:none !important;
    }

    .chequesMeta{
      margin-bottom:12px !important;
      padding:12px 14px !important;
      border:1px solid rgba(173,204,240,.13) !important;
      border-radius:11px !important;
      background:rgba(7,24,46,.50) !important;
      color:#bdd0e4 !important;
      font-size:11px !important;
      font-weight:600 !important;
    }

    .filialBar{
      display:flex !important;
      flex-wrap:wrap !important;
      gap:8px !important;
      margin-bottom:14px !important;
    }

    .filialBar button,
    .filialBtn{
      min-height:34px !important;
      padding:0 11px !important;
      border:1px solid rgba(173,204,240,.15) !important;
      border-radius:999px !important;
      background:rgba(255,255,255,.04) !important;
      color:#c6d4e4 !important;
      font-size:10px !important;
      font-weight:800 !important;
      cursor:pointer;
    }

    .filialBar button:hover,
    .filialBar button.isActive,
    .filialBtn.isActive{
      color:#fff !important;
      border-color:rgba(78,141,247,.48) !important;
      background:rgba(78,141,247,.13) !important;
    }

    .nfTableWrap{
      overflow:auto !important;
      border:1px solid rgba(173,204,240,.12) !important;
      border-radius:13px !important;
      background:rgba(4,18,36,.34) !important;
    }

    .nfTable{
      width:100%;
      min-width:900px;
      border-collapse:collapse !important;
      background:transparent !important;
      color:#dce7f4 !important;
    }

    .nfTable th,
    .nfTable td{
      padding:12px 13px !important;
      border-bottom:1px solid rgba(173,204,240,.09) !important;
      font-size:11px !important;
      white-space:nowrap;
    }

    .nfTable th{
      color:#d5e1ef !important;
      background:#0d2b4e !important;
      font-size:9px !important;
      font-weight:800 !important;
      letter-spacing:.045em !important;
      text-transform:uppercase !important;
    }

    .nfTable tbody tr{
      transition:.15s ease;
    }

    .nfTable tbody tr:hover{
      background:rgba(78,141,247,.07) !important;
    }

    .nfTable button,
    .nfTable a{
      border-radius:9px !important;
    }

    /* =========================================================
       MODAL
       ========================================================= */
    #modalAdmin{
      position:fixed !important;
      inset:0 !important;
      z-index:9999 !important;
      display:none;
      align-items:center !important;
      justify-content:center !important;
      padding:18px !important;
      background:rgba(0,0,0,.64) !important;
      backdrop-filter:blur(8px);
    }

    #modalAdmin.isOpen,
    #modalAdmin.show{
      display:flex !important;
    }

    #modalAdmin[aria-hidden="false"]{
      display:flex !important;
    }

    .modalCard{
      width:min(900px,100%) !important;
      max-height:90vh;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14) !important;
      border-radius:18px !important;
      background:#101f38 !important;
      box-shadow:0 24px 70px rgba(0,0,0,.55) !important;
    }

    .modalHead,
    .modalFoot{
      display:flex !important;
      align-items:center !important;
      justify-content:space-between !important;
      gap:12px !important;
      padding:15px 18px !important;
      background:rgba(255,255,255,.05) !important;
    }

    .modalHead{
      border-bottom:1px solid rgba(255,255,255,.10) !important;
    }

    .modalFoot{
      justify-content:flex-end !important;
      border-top:1px solid rgba(255,255,255,.10) !important;
    }

    .modalHead h2{
      margin:0 !important;
      color:#fff !important;
      font-size:17px !important;
    }

    .iconClose{
      width:38px !important;
      height:38px !important;
      border:1px solid rgba(255,255,255,.14) !important;
      border-radius:11px !important;
      background:rgba(255,255,255,.06) !important;
      color:#fff !important;
      cursor:pointer;
    }

    .modalBody{
      max-height:calc(100vh - 220px);
      overflow:auto;
      padding:18px !important;
    }

    .grid2{
      display:grid !important;
      grid-template-columns:1fr 1fr !important;
      gap:14px !important;
    }

    #modalFieldsAdmin label{
      display:block;
      margin:0 0 7px;
      color:#dbe5f2;
      font-size:11px;
      font-weight:700;
    }

    #modalFieldsAdmin input,
    #modalFieldsAdmin select,
    #modalFieldsAdmin textarea{
      width:100%;
      min-height:42px;
      padding:10px 11px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:10px;
      outline:none;
      background:#0a172b;
      color:#fff;
      font:500 12px "Inter",sans-serif;
    }

    #modalFieldsAdmin textarea{
      min-height:110px;
      resize:vertical;
    }

    /* =========================================================
       RESPONSIVO
       ========================================================= */
    @media(max-width:1380px){
      .admin-summary{
        grid-template-columns:repeat(3,minmax(0,1fr)) !important;
      }

      .cardsGrid{
        grid-template-columns:repeat(3,minmax(0,1fr)) !important;
      }
    }

    @media(max-width:980px){
      .admin-wrap{
        width:min(100% - 30px,1560px) !important;
      }

      .panelHead{
        align-items:flex-start !important;
        flex-direction:column !important;
      }

      .panelRight{
        width:100%;
        justify-content:flex-start !important;
      }

      .adminSelect,
      .adminSearch{
        flex:1 1 220px;
        width:auto !important;
      }

      .cardsGrid{
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
      }
    }

    @media(max-width:680px){
      .topbar{
        height:auto;
        min-height:76px;
        padding:10px 0;
      }

      .topbar-inner{
        width:min(100% - 24px,1780px) !important;
      }

      .brand img{
        width:135px !important;
      }

      .hero.admin-hero{
        min-height:calc(100vh - 76px);
        padding-top:28px !important;
      }

      .admin-wrap{
        width:min(100% - 22px,1560px) !important;
      }

      .admin-title-row{
        align-items:flex-start;
      }

      .admin-gear{
        width:48px;
        height:48px;
        font-size:21px;
      }

      .admin-h1{
        font-size:30px !important;
      }

      .admin-summary{
        grid-template-columns:1fr !important;
      }

      .sumCard{
        min-height:128px !important;
      }

      .cardsGrid{
        grid-template-columns:1fr !important;
      }

      .panelRight{
        display:grid !important;
        grid-template-columns:1fr 1fr !important;
      }

      .adminSelect,
      .adminSearch{
        width:100% !important;
        min-width:0 !important;
      }

      .grid2{

            <div class="sumValue"><span id="kpiEpis">0</span> entregas</div>
          </div>
        </button>
      </div>

      <div class="admin-tabs">

        <button class="tabBtn" data-tab="solicitacoes" type="button">Solicitações</button>

                  </thead>
                  <tbody id="materiaisTbody"></tbody>
                </table>

            </div>
          </div>

          <div class="view" id="view-solicitacoes">

          </div>

          <div class="view" id="view-patrimonio">

          <div class="view" id="view-epis">
