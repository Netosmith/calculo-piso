<!-- divulgacao.html -->
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Divulgação | NOVA FROTA</title>
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/divulgacao.css" />

  <style>
    /* MODELO 2: posicionamento específico para artes 1024 x 1536 */
    [data-template-preview="2"]{
      position:relative;
      overflow:hidden;
      aspect-ratio:2 / 3;
    }

    [data-template-preview="2"] .previewBg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      z-index:0;
    }

    [data-template-preview="2"] .previewColeta,
    [data-template-preview="2"] .previewDescarga,
    [data-template-preview="2"] .previewPrice,
    [data-template-preview="2"] .previewNote,
    [data-template-preview="2"] .previewFilial,
    [data-template-preview="2"] .previewContacts{
      position:absolute;
      z-index:2;
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
      text-shadow:none;
    }

    /* Cidade/UF da coleta */
    [data-template-preview="2"] .previewColeta{
      top:48.4%;
      left:25.2%;
      width:66%;
      text-align:left;
    }

    /* Cidade/UF da descarga */
    [data-template-preview="2"] .previewDescarga{
      top:58.2%;
      left:25.2%;
      width:66%;
      text-align:left;
    }

    /* Cidades e UF em azul */
    [data-template-preview="2"] .previewValue{
      color:#082f6b;
      font-size:clamp(11px,2.15vw,31px);
      line-height:1.05;
      font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Local de coleta e descarga em verde escuro */
    [data-template-preview="2"] .previewSmall{
      margin-top:1.1%;
      color:#17662a;
      font-size:clamp(8px,1.35vw,20px);
      line-height:1.08;
      font-weight:800;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* O nome do produto já faz parte da arte correspondente */
    [data-template-preview="2"] .previewProduct{
      display:none;
    }

    /* Valor do frete dentro da faixa azul */
    [data-template-preview="2"] .previewPrice{
      top:75.1%;
      left:28.5%;
      width:58%;
      color:#fff;
      font-size:clamp(10px,1.9vw,28px);
      line-height:1;
      font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Nome da filial em azul */
    [data-template-preview="2"] .previewFilial{
      top:84.7%;
      left:18.3%;
      width:27%;
      color:#082f6b;
      font-size:clamp(8px,1.45vw,22px);
      line-height:1.05;
      font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Contatos em azul, ao lado do WhatsApp */
    [data-template-preview="2"] .previewContacts{
      top:83.7%;
      left:56.2%;
      width:38%;
      color:#082f6b;
      font-size:clamp(7px,1.05vw,16px);
      line-height:1.34;
      font-weight:900;
      text-transform:uppercase;
      text-align:left;
    }

    [data-template-preview="2"] .previewContactLine{
      min-height:1.3em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Observação dentro da faixa azul inferior */
    [data-template-preview="2"] .previewNote{
      top:94.75%;
      left:12%;
      width:76%;
      color:#fff;
      font-size:clamp(8px,1.2vw,18px);
      line-height:1;
      font-weight:800;
      text-align:center;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* No Modelo 2 não exibir placeholders sobre a imagem */
    [data-template-preview="2"] [data-bind]:empty::before{
      content:"" !important;
    }
  </style>

</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="burger" href="./home.html" title="Voltar">🏠</a>
        <img src="../assets/img/logo-novafrota.png" alt="NOVA FROTA" />
      </div>

      <div class="actions">
        <div class="icon-btn" title="Sair" data-logout>↩️</div>
      </div>
    </div>
  </div>

  <main class="container divulgacao-page">
    <header class="page-header">
      <div>
        <h1>Divulgação</h1>
        <p>Escolha um modelo, preencha os campos e salve a imagem em JPG.</p>
      </div>

      <a class="btnTiny ghost" href="./home.html">Voltar</a>
    </header>

    <!-- MODELO 1 -->
    <section class="templateCard" data-template="1">
      <div class="templateHeader">
        <h2>Modelo 1 - Coleta x Descarga</h2>
        <p>Layout direto para anúncios rápidos.</p>
      </div>

      <div class="templateBody">
        <div class="templateForm">
          <label>Local de coleta (Cidade-UF)</label>
          <input data-template="1" data-field="coletaCidade" placeholder="Ex: INDIARA-GO" />

          <label>Local de coleta (Detalhe)</label>
          <input data-template="1" data-field="coletaLocal" placeholder="Ex: Faz Ouro Branco" />

          <label>Local de descarga (Cidade-UF)</label>
          <input data-template="1" data-field="descargaCidade" placeholder="Ex: RIO VERDE-GO" />

          <label>Local de descarga (Detalhe)</label>
          <input data-template="1" data-field="descargaLocal" placeholder="Ex: Terminal Rumo" />

          <label>Produto</label>
          <input
            data-template="1"
            data-field="produto"
            placeholder="Ex: Soja / Milho / Açúcar / Calcário / Farelo de Soja / Sorgo / Fertilizante"
          />

          <label>Valor por tonelada</label>
          <input data-template="1" data-field="valor" placeholder="Ex: R$ 43,00 / A COMBINAR" />

          <label>Observações</label>
          <input data-template="1" data-field="obs" placeholder="Ex: Pagamento PIX ou cheque" />

          <label>Filial</label>
          <select data-template="1" data-field="filial">
            <option value="">Selecione...</option>
            <option value="RIOVERDE">RIO VERDE</option>
            <option value="MESAOPERACIONAL">MESA OPERACIONAL</option>
            <option value="BOMJESUS">BOM JESUS</option>
            <option value="FERTILIZANTE">FERTILIZANTE</option>
            <option value="MONTIVIDIU">MONTIVIDIU</option>
            <option value="MINEIROS">MINEIROS</option>
            <option value="INDIARA">INDIARA</option>
            <option value="FORMOSA">FORMOSA</option>
            <option value="CRISTALINA">CRISTALINA</option>
            <option value="CGOMG">CGO MG</option>
            <option value="ANAPOLIS">ANÁPOLIS</option>
            <option value="URUACU">URUAÇU</option>
            <option value="ITUMBIARA">ITUMBIARA</option>
            <option value="SAOPAULO">SÃO PAULO</option>
            <option value="VIANOPOLIS">VIANÓPOLIS</option>
            <option value="CHAPEU">CHAPÉU</option>
            <option value="ARAGUARI">ARAGUARI</option>
            <option value="JATAI">JATAÍ</option>
          </select>

          <label>Contatos (linha 1)</label>
          <input data-template="1" data-field="contato1" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 2)</label>
          <input data-template="1" data-field="contato2" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 3)</label>
          <input data-template="1" data-field="contato3" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 4)</label>
          <input data-template="1" data-field="contato4" placeholder="Ex: (64) 9xxxx-xxxx" />
        </div>

        <div class="templatePreview" data-template-preview="1">
          <img class="previewBg" src="../assets/img/SOJATESTE.png" alt="" />

          <div class="previewColeta">
            <div class="previewValue" data-bind="coletaCidade" data-placeholder="-CIDADE-UF"></div>
            <div class="previewSmall" data-bind="coletaLocal" data-placeholder="Local"></div>
          </div>

          <div class="previewDescarga">
            <div class="previewValue" data-bind="descargaCidade" data-placeholder="-CIDADE-UF"></div>
            <div class="previewSmall" data-bind="descargaLocal" data-placeholder="Local"></div>
          </div>

          <div class="previewProduct" data-bind="produto" data-placeholder="Produto"></div>
          <div class="previewPrice" data-bind="valor" data-placeholder="Valor por tonelada"></div>
          <div class="previewNote" data-bind="obs" data-placeholder="Observações"></div>

          <div class="previewContacts">
            <div class="previewContactLine" data-bind="contato1" data-placeholder="Contato 1"></div>
            <div class="previewContactLine" data-bind="contato2" data-placeholder="Contato 2"></div>
            <div class="previewContactLine" data-bind="contato3" data-placeholder="Contato 3"></div>
            <div class="previewContactLine" data-bind="contato4" data-placeholder="Contato 4"></div>
          </div>
        </div>
      </div>

      <div class="templateActions">
        <button class="btnTiny green" data-action="save" data-template="1">Salvar JPG</button>
        <button class="btnTiny ghost" data-action="reset" data-template="1">Resetar</button>
      </div>
    </section>

    <!-- MODELO 2 -->
    <section class="templateCard" data-template="2">
      <div class="templateHeader">
        <h2>Modelo 2 - Frota Nova</h2>
        <p>Layout com as novas imagens por produto.</p>
      </div>

      <div class="templateBody">
        <div class="templateForm">
          <label>Local de coleta (Cidade-UF)</label>
          <input data-template="2" data-field="coletaCidade" placeholder="Ex: INDIARA-GO" />

          <label>Local de coleta (Detalhe)</label>
          <input data-template="2" data-field="coletaLocal" placeholder="Ex: Faz Ouro Branco" />

          <label>Local de descarga (Cidade-UF)</label>
          <input data-template="2" data-field="descargaCidade" placeholder="Ex: RIO VERDE-GO" />

          <label>Local de descarga (Detalhe)</label>
          <input data-template="2" data-field="descargaLocal" placeholder="Ex: Terminal Rumo" />

          <label>Produto</label>
          <input
            data-template="2"
            data-field="produto"
            placeholder="Ex: Soja / Milho / Açúcar / Calcário / Farelo de Soja / Sorgo / Fertilizante"
          />

          <label>Valor por tonelada</label>
          <input data-template="2" data-field="valor" placeholder="Ex: R$ 43,00 / A COMBINAR" />

          <label>Observações</label>
          <input data-template="2" data-field="obs" placeholder="Ex: Pagamento PIX ou cheque" />

          <label>Filial</label>
          <select data-template="2" data-field="filial">
            <option value="">Selecione...</option>
            <option value="RIOVERDE">RIO VERDE</option>
            <option value="MESAOPERACIONAL">MESA OPERACIONAL</option>
            <option value="BOMJESUS">BOM JESUS</option>
            <option value="FERTILIZANTE">FERTILIZANTE</option>
            <option value="MONTIVIDIU">MONTIVIDIU</option>
            <option value="MINEIROS">MINEIROS</option>
            <option value="INDIARA">INDIARA</option>
            <option value="FORMOSA">FORMOSA</option>
            <option value="CRISTALINA">CRISTALINA</option>
            <option value="CGOMG">CGO MG</option>
            <option value="ANAPOLIS">ANÁPOLIS</option>
            <option value="URUACU">URUAÇU</option>
            <option value="ITUMBIARA">ITUMBIARA</option>
            <option value="SAOPAULO">SÃO PAULO</option>
            <option value="VIANOPOLIS">VIANÓPOLIS</option>
            <option value="CHAPEU">CHAPÉU</option>
            <option value="ARAGUARI">ARAGUARI</option>
            <option value="JATAI">JATAÍ</option>
          </select>

          <label>Contatos (linha 1)</label>
          <input data-template="2" data-field="contato1" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 2)</label>
          <input data-template="2" data-field="contato2" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 3)</label>
          <input data-template="2" data-field="contato3" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 4)</label>
          <input data-template="2" data-field="contato4" placeholder="Ex: (64) 9xxxx-xxxx" />
        </div>

        <div class="templatePreview" data-template-preview="2">
          <img class="previewBg" src="../assets/img/SOJA2.png" alt="" />

          <div class="previewColeta">
            <div class="previewValue" data-bind="coletaCidade"></div>
            <div class="previewSmall" data-bind="coletaLocal"></div>
          </div>

          <div class="previewDescarga">
            <div class="previewValue" data-bind="descargaCidade"></div>
            <div class="previewSmall" data-bind="descargaLocal"></div>
          </div>

          <div class="previewProduct" data-bind="produto"></div>
          <div class="previewPrice" data-bind="valor"></div>
          <div class="previewFilial" data-bind="filial"></div>

          <div class="previewContacts">
            <div class="previewContactLine" data-bind="contato1"></div>
            <div class="previewContactLine" data-bind="contato2"></div>
            <div class="previewContactLine" data-bind="contato3"></div>
            <div class="previewContactLine" data-bind="contato4"></div>
          </div>

          <div class="previewNote" data-bind="obs"></div>
        </div>
      </div>

      <div class="templateActions">
        <button class="btnTiny green" data-action="save" data-template="2">Salvar JPG</button>
        <button class="btnTiny ghost" data-action="reset" data-template="2">Resetar</button>
      </div>
    </section>
  </main>

  <script src="../assets/js/auth.js?v=6"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="../assets/js/divulgacao.js?v=4"></script>

  <script>
    if (requireFeatureAuth(
      "divulgacao",
      "Divulgação não liberada para este perfil."
    ) === true) {
      bindLogoutButton();
    }
  </script>
</body>
</html>
