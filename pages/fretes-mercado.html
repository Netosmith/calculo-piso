<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fretes Mercado | NOVA FROTA</title>

  <link rel="stylesheet" href="../assets/css/app.css" />
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg:#f5f7fb; --panel:#fff; --line:#dbe4ee; --text:#10233d; --muted:#6f8195;
      --navy:#0d2f5f; --blue:#2563eb; --green:#0fa968; --red:#e64646;
      --shadow:0 8px 26px rgba(27,49,78,.08); --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    body{overflow-x:hidden}
    .container{padding:18px;max-width:100%}

    .topbar{background:#fff!important;border-bottom:1px solid var(--line)!important;box-shadow:0 2px 10px rgba(15,35,63,.04)}
    .topbar .icon-btn,.topbar .burger{background:#fff!important;color:var(--text)!important;border:1px solid var(--line)!important}

    .pageShell{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
    .pageHeader{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .titleWrap{display:flex;flex-direction:column;gap:4px}
    .pageHeader h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--text)}
    .pageSubtitle{color:var(--muted);font-size:12px;font-weight:600}
    .headerActions{display:flex;gap:8px;flex-wrap:wrap}

    .btnAction{min-height:40px;padding:0 16px;border:1px solid #c9d5e2;border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;background:#fff;color:var(--text);transition:.15s}
    .btnAction:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(15,35,63,.08)}
    .btnAction.green{background:var(--green);border-color:var(--green);color:#fff}
    .btnAction.red{background:#fff;border-color:#f3b5b5;color:#c22f2f}
    .btnAction.blue{background:var(--blue);border-color:var(--blue);color:#fff}

    .statusBar{margin-top:12px;padding:10px 12px;border:1px solid #bde8d0;border-radius:10px;background:#eaf8f1;font-size:11px;font-weight:800;color:#0b7d4e}

    .marketShell{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .table{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 10px;scroll-behavior:smooth}
    .table::-webkit-scrollbar{height:10px}
    .table::-webkit-scrollbar-track{background:#eef2f7;border-radius:999px}
    .table::-webkit-scrollbar-thumb{background:#bcc9d8;border-radius:999px}

    .regiao{background:#fff;border:1px solid var(--line);border-radius:14px;min-width:220px;width:220px;flex:0 0 220px;overflow:hidden;box-shadow:0 4px 14px rgba(27,49,78,.06)}
    .regiao:hover{border-color:#b7c9dd;box-shadow:0 8px 20px rgba(27,49,78,.10)}
    .regiao h3{margin:0;padding:12px 10px;text-align:center;font-size:13px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0d2f5f,#174a86)}
    .regiao>.row{margin-left:10px;margin-right:10px}
    .regiao>.row.header{margin-top:10px}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;align-items:center}
    .row.header b{font-size:9px;text-transform:uppercase;color:#65778c;letter-spacing:.05em;font-weight:900}

    input{width:100%;min-height:32px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;outline:none;font-size:10px;color:var(--text);background:#fff;transition:.15s}
    input:focus{border-color:#6da3f7;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
    input[readonly]{opacity:1;background:#f3f6fa;color:#17324f;border-color:#e0e7ef}
    .baseInput{font-weight:800;color:#17324f}
    .freteInput{text-align:right;font-size:10px;font-weight:800;color:#0d2f5f;background:#f9fbfd}

    @media(max-width:900px){.container{padding:10px}.pageHeader{align-items:flex-start}.pageHeader h1{font-size:19px}.regiao{min-width:200px;width:200px;flex-basis:200px}}

    @page{size:A4 landscape;margin:6mm}
    @media print{
      html,body{background:#fff!important;color:#000!important;width:297mm;height:210mm;overflow:hidden!important}
      .topbar,.headerActions,.statusBar{display:none!important}
      .container{padding:0!important;width:100%!important}
      .pageShell,.marketShell{border:none!important;box-shadow:none!important;padding:0!important}
      .pageHeader{margin-bottom:4mm!important}.pageHeader h1{font-size:14px!important;color:#000!important}.pageSubtitle{display:none!important}
      .table{display:flex!important;gap:3mm!important;overflow:visible!important;align-items:flex-start!important;width:100%!important;transform:scale(.82);transform-origin:top left}
      .regiao{break-inside:avoid;page-break-inside:avoid;color:#000!important;background:#fff!important;box-shadow:none!important;border:1px solid #cfcfcf!important;width:38mm!important;min-width:38mm!important;flex:0 0 38mm!important}
      .regiao h3{font-size:9px!important;margin:0!important;padding:2mm!important;color:#000!important;background:#f2f2f2!important;border-bottom:1px solid #ccc!important}
      .row{gap:1.5mm!important;margin-bottom:1.5mm!important}.row.header b{font-size:6.5px!important;color:#000!important}
      input{color:#000!important;background:#fff!important;border:1px solid #bbb!important;min-height:7mm!important;padding:1.2mm 1.6mm!important;font-size:7px!important}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button id="btnHomeMercado" class="burger" type="button" title="Home">🏠</button>
        <img src="../assets/img/logo-novafrota.png" alt="NOVA FROTA" />
      </div>
      <div class="actions">
        <button id="btnSairMercado" class="icon-btn" type="button">SAIR</button>
      </div>
    </div>
  </div>

  <div class="container">
    <section class="pageShell">
      <div class="pageHeader">
        <div class="titleWrap">
          <h1>Fretes Mercado</h1>
          <div class="pageSubtitle">Tabela de referência de fretes por base e corredor.</div>
        </div>
        <div class="headerActions">
          <button id="btnSalvarMercado" class="btnAction green" type="button">Salvar</button>
          <button id="btnZerarMercado" class="btnAction red" type="button">Zerar</button>
          <button id="btnPrintMercado" class="btnAction blue" type="button">Print</button>
        </div>
      </div>
      <div id="statusMercado" class="statusBar">🔄 Carregando...</div>
    </section>

    <section class="marketShell">
      <div id="tabela" class="table"></div>
    </section>
  </div>

  <script src="../assets/js/auth.js?v=6"></script>
  <script src="../assets/js/fretes-mercado.js?v=2"></script>
  <script>bindLogoutButton();</script>
</body>
</html>
