<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Link de validação inválido | Nova Frota</title>
<style>
body{min-height:100vh;margin:0;background:#eef4fa;color:#123b56;font:16px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}
main{max-width:480px;background:white;border:1px solid #d4e2ed;border-radius:16px;padding:25px;text-align:center}
a{font-weight:700;color:#087758}
</style>
</head>
<body>
<main>
<h1>Link de validação inválido</h1>
<p>Este link de validação é inválido ou está incompleto.</p>
<p>Solicite um novo link de validação à transportadora.</p>

</main>
<script>
(()=>{"use strict";
 const token=window.location.hash.replace(/^#/,"").trim();
 // Preserva links antigos com token válido; endereço sem token exibe o aviso.
 if(/^[a-f0-9]{64}$/.test(token)){
  window.location.replace("/pages/validacao.html#"+token);
 }
})();
</script>
</body>
</html>
