body{min-height:100vh;margin:0;background:#eef4fa;color:#123b56;font:16px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}
main{max-width:480px;background:white;border:1px solid #d4e2ed;border-radius:16px;padding:25px;text-align:center}

<body>
<main>
<h1>Endereço atualizado</h1>
<p>A página de localização pontual agora está em <strong>validacao.html</strong>.</p>
<p>Você será redirecionado para a nova página, onde poderá autorizar o envio de um único ponto GPS.</p>
<p><a id="next" href="/pages/validacao.html">Abrir a nova página</a></p>
</main>
<script>
(()=>{"use strict";
 const destination="/pages/validacao.html"+window.location.hash;
 document.getElementById("next").href=destination;
 window.location.replace(destination);
})();
</script>
