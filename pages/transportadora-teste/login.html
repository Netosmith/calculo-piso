<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Login | Transportadora Teste | Portal Frete</title>
  <link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-tenant-id="teste-01">
  <!-- Somente o ponto de entrada muda. Home e todos os apps utilizam /pages e /assets compartilhados. -->
  <main class="login-wrap">
    <form class="login-card" id="tenantLoginForm" autocomplete="on">
      <div class="head">
        <img src="../../assets/img/PORTALFRETELOGO.png" alt="Portal Frete">
        <div>
          <div style="font-weight:900;font-size:16px">Sistema Operacional</div>
          <div style="font-size:12px;color:rgba(233,238,252,.75)">Acesso restrito</div>
        </div>
      </div>
      <div class="small" style="margin:0 0 16px;text-align:left">TRANSPORTADORA TESTE</div>
      <label class="label" for="user">Usuário</label>
      <input class="input" id="user" name="username" autocomplete="username" required maxlength="80" placeholder="Digite seu usuário">
      <label class="label" for="pass">Senha</label>
      <input class="input" id="pass" name="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
      <button class="btn" id="btnLogin" type="submit">Entrar</button>
      <div class="err" id="err" role="alert" aria-live="polite" hidden></div>
      <div class="small">Sistema Operacional Unificado</div>
    </form>
  </main>
  <script src="../../assets/js/api.js?v=9"></script>
  <script src="../../assets/js/auth.js?v=23"></script>
  <script src="../../assets/js/tenant-login.js?v=1" defer></script>
</body>
</html>
